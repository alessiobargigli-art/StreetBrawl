name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install client dependencies
        run: npm ci
      - name: Build browser client
        run: npm run build
      - name: Run shared simulation regression tests
        run: |
          rm -rf .test-dist
          npx tsc src/shared/campaign.ts src/shared/protocol.ts src/shared/simulation.ts --target ES2020 --module commonjs --moduleResolution node --outDir .test-dist --esModuleInterop --skipLibCheck
          printf '{"type":"commonjs"}' > .test-dist/package.json
          node --test tests/simulation.test.cjs
      - name: Run client reconnect regression tests
        run: |
          rm -rf .test-client
          npx tsc src/online/CoopClient.ts src/shared/protocol.ts src/shared/campaign.ts --target ES2020 --module commonjs --moduleResolution node --outDir .test-client --esModuleInterop --skipLibCheck
          printf '{"type":"commonjs"}' > .test-client/package.json
          node --test tests/client-reconnect.test.cjs
      - name: Run required-art preload regression test
        run: |
          rm -rf .test-game
          npx tsc src/online/CoopGame.ts src/online/CoopClient.ts src/shared/protocol.ts src/shared/campaign.ts --target ES2020 --module commonjs --moduleResolution node --outDir .test-game --esModuleInterop --skipLibCheck
          printf '{"type":"commonjs"}' > .test-game/package.json
          node --test tests/assets.test.cjs tests/movement-assets.test.cjs tests/coop-combat-atlas.test.cjs tests/enemy-atlas.test.cjs
      - name: Install worker dependencies
        working-directory: worker
        run: npm ci
      - name: Run room scene/reconnect regression tests
        working-directory: worker
        run: |
          rm -rf ../.test-room
          npx tsc src/room.ts ../src/shared/protocol.ts ../src/shared/campaign.ts ../src/shared/simulation.ts --target ES2022 --module commonjs --moduleResolution node --outDir ../.test-room --esModuleInterop --skipLibCheck --types @cloudflare/workers-types
          printf '{"type":"commonjs"}' > ../.test-room/package.json
          cd ..
          node --test tests/room-scenes.test.cjs
      - name: Typecheck authoritative worker and shared simulation
        working-directory: worker
        run: npm run typecheck
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:e2e
