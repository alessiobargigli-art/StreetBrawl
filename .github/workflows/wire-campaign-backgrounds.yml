name: Wire campaign backgrounds
on:
  push:
    branches: [feature/coop-six-stage-campaign]
    paths: ['.github/workflows/wire-campaign-backgrounds.yml']
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/coop-six-stage-campaign
      - name: Wire stage art
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/online/CoopGame.ts')
          s=p.read_text()
          old="stage1:'/assets/stages/stage1-street.svg',stage2:'/assets/stages/stage2-docks.svg'"
          new="stage1:'/assets/stages/stage1-street.svg',stage2:'/assets/stages/coop-stage2-market.svg',stage3:'/assets/stages/coop-stage3-train.svg',stage4:'/assets/stages/coop-stage4-depot.svg',stage5:'/assets/stages/coop-stage5-harbor.svg',stage6:'/assets/stages/coop-stage6-cargo.svg'"
          if old not in s: raise SystemExit('legacy stage map not found')
          s=s.replace(old,new,1)
          old2="img=this.images.get(stage===1?'stage1':stage===5||stage===6?'stage2':'');"
          new2="img=this.images.get(`stage${stage}`);"
          if old2 not in s: raise SystemExit('background selector not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          git rm .github/workflows/wire-campaign-backgrounds.yml
          git add src/online/CoopGame.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat: wire six distinct campaign backgrounds"
          git push origin HEAD:feature/coop-six-stage-campaign
