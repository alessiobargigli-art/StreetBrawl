name = "streetbrawl-coop"
main = "src/index.ts"
compatibility_date = "2026-09-17"

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/health", "/rooms", "/rooms/*"]

[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "GameRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
